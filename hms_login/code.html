<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass-panel {
            background: rgba(39, 42, 44, 0.85); /* surface-container-high */
            border: 1px solid rgba(59, 74, 70, 0.3); /* outline-variant */
        }
      </style>

<body class="bg-[#0B1929] text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary/30">
<!-- Auto-logout countdown banner -->
<div class="w-full bg-error/10 border-b border-error/20 px-gutter py-2 flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-error text-[18px]">timer</span>
<span class="font-label-md text-error">Session expires in 14:59. Please log in to continue.</span>
</div>
<main class="flex-grow flex items-center justify-center p-gutter relative w-full h-full">
<!-- Background subtle glow -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none flex items-center justify-center">
<div class="w-[800px] h-[800px] bg-primary/5 rounded-full blur-[100px] opacity-50"></div>
</div>
<div class="w-full max-w-[440px] z-10">
<!-- Glassmorphic Card -->
<div class="glass-panel rounded-xl shadow-2xl p-8 flex flex-col gap-8 relative overflow-hidden">
<!-- Inner Subtle Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-3/4 h-1 bg-primary/20 blur-[2px]"></div>
<!-- Header / Logo -->
<div class="flex flex-col items-center text-center gap-2">
<div class="w-16 h-16 rounded-lg bg-surface-container-low flex items-center justify-center mb-2 border border-outline-variant/30 shadow-inner">
<span class="material-symbols-outlined text-primary text-[32px] font-[200]">medical_services</span>
</div>
<h1 class="font-headline-md text-headline-md text-white tracking-tight">Lumina Medical</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Secure Access Portal</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 w-full">
<!-- Role Selector -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1" for="role">Access Role</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border border-outline-variant/50 rounded-lg py-3 px-4 text-white font-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer pr-10" id="role" name="role">
<option value="admin">Administrator</option>
<option selected="" value="doctor">Doctor</option>
<option value="nurse">Nurse</option>
<option value="receptionist">Receptionist</option>
<option value="pharmacist">Pharmacist</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-2 relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider ml-1 transition-colors group-focus-within:text-primary" for="username">Credentials ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">badge</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-3 pl-11 pr-4 text-white font-body-lg placeholder-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="username" name="username" placeholder="e.g. LUM-8492" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-2 relative group">
<div class="flex justify-between items-center ml-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider transition-colors group-focus-within:text-primary" for="password">Passcode</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">Recover Access</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg py-3 pl-11 pr-11 text-white font-body-lg placeholder-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-white transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Hardware Key Auth (Optional decorative element to enhance clinical feel) -->
<div class="flex items-center gap-3 p-3 rounded-lg border border-outline-variant/30 bg-surface-container-lowest/50 mt-2">
<span class="material-symbols-outlined text-primary/70">usb</span>
<div class="flex flex-col flex-grow">
<span class="font-label-md text-label-md text-on-surface">Hardware Key</span>
<span class="font-caption text-caption text-on-surface-variant">Insert YubiKey for 2FA</span>
</div>
<div class="w-2 h-2 rounded-full bg-outline-variant animate-pulse"></div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-fixed text-on-primary font-title-lg text-title-lg py-4 rounded-lg transition-all duration-200 mt-4 flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(68,229,204,0.15)] hover:shadow-[0_0_20px_rgba(68,229,204,0.3)] transform hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98]" type="submit">
<span>Authenticate</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Info -->
<div class="pt-6 mt-2 border-t border-outline-variant/20 flex flex-col items-center gap-1 text-center">
<div class="flex items-center gap-1.5 text-on-surface-variant">
<span class="material-symbols-outlined text-[14px]">history</span>
<span class="font-caption text-caption">Last login: 10:42 AM EST from Workstation 4</span>
</div>
<span class="font-caption text-caption text-on-surface-variant/60 mt-2">v.4.12.0 (Build 892) • System Status: Optimal</span>
</div>
</div>
</div>
</main>
<script>
    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const role = document.getElementById('role').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role, username, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', data.role);
                
                // Redirect based on role
                if (data.role === 'Admin' || data.role === 'admin') {
                    window.location.href = '/static/clinical_reporting_dashboard/code.html';
                } else {
                    alert('Login successful, but dashboard for this role is not yet wired.');
                }
            } else {
                const error = await response.json();
                alert('Authentication failed: ' + (error.detail || 'Invalid credentials'));
            }
        } catch (err) {
            console.error('Login error:', err);
            alert('A connection error occurred. Please check the backend.');
        }
    });
</script>
</body></html>
